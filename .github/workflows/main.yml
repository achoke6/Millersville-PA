name: Millersville Data Update & Deploy
on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Validate hand-maintained JSON files before doing anything expensive.
      # camps.json, org-overrides.json, and shortnames-overlay.json
      # are edited by hand — a missing comma or stray quote silently breaks the
      # scraper (or worse, breaks app.js after deploy). Catching it here means
      # PRs and pushes fail fast at the validation step, with a clear message
      # pointing at the broken file, before we waste 60+ seconds running scrape.
      #
      # `jq empty` validates JSON syntax without producing output; a non-zero
      # exit means parse failure. The shape checks below are intentionally
      # minimal — just the fields the scraper actually requires — so we
      # don't reject a perfectly fine file for missing optional metadata.
      - name: Validate hand-maintained JSON
        run: |
          set -e
          for f in camps.json org-overrides.json shortnames-overlay.json imleagues.json venue-aliases.json place-specials.json; do
            if [ -f "$f" ]; then
              echo "Checking $f..."
              jq empty "$f" || { echo "❌ $f has invalid JSON syntax"; exit 1; }
            else
              echo "  (skip — $f not present)"
            fi
          done

          # Shape checks for files the scraper depends on by structure, not
          # just syntax. If these schemas drift, the scraper may run without
          # erroring but produce wrong output (e.g. silent dropped events).
          if [ -f camps.json ]; then
            jq -e 'type == "array" and (length == 0 or (all(.title and .date)))' camps.json > /dev/null \
              || { echo "❌ camps.json must be an array of objects, each with title + date"; exit 1; }
          fi
          if [ -f org-overrides.json ]; then
            jq -e '.overrides | type == "array" and (length == 0 or (all(.titlePattern and .orgName)))' org-overrides.json > /dev/null \
              || { echo "❌ org-overrides.json must have an .overrides array; each entry needs titlePattern + orgName"; exit 1; }
          fi
          if [ -f shortnames-overlay.json ]; then
            jq -e '.overrides | type == "object"' shortnames-overlay.json > /dev/null \
              || { echo "❌ shortnames-overlay.json must have an .overrides object (string→string map)"; exit 1; }
          fi
          if [ -f venue-aliases.json ]; then
            jq -e '.overrides | type == "object"' venue-aliases.json > /dev/null \
              || { echo "❌ venue-aliases.json must have an .overrides object (normalized location→slug map)"; exit 1; }
          fi
          if [ -f imleagues.json ]; then
            jq -e 'type == "array" and (length == 0 or (all(.title and .deadline)))' imleagues.json > /dev/null \
              || { echo "❌ imleagues.json must be an array of objects, each with title + deadline"; exit 1; }
          fi
          if [ -f place-specials.json ]; then
            jq -e '.places | type == "object"' place-specials.json > /dev/null \
              || { echo "❌ place-specials.json must have a .places object (slug → place entry)"; exit 1; }
            jq -e '.places | keys | all(test("^[a-z0-9][a-z0-9-]*$"))' place-specials.json > /dev/null \
              || { echo "❌ place-specials.json keys must be directory place slugs (lowercase letters/digits/hyphens)"; exit 1; }
            jq -e '[.places[] | select(has("weekly")) | .weekly] | all(has("items") and has("validThrough"))' place-specials.json > /dev/null \
              || { echo "❌ place-specials.json: every weekly block needs items + validThrough"; exit 1; }
          fi
          echo "✓ All JSON files valid"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Caches ~/.npm (the global download cache, keyed off package-lock.json)
          # so npm ci doesn't re-download dependencies on every cron run. With
          # the lockfile pinned, this typically cuts dep install from ~30s to
          # ~5s — at 24 runs/day that compounds to ~70 hours of CI/year.
          cache: 'npm'

      # `npm ci` instead of `npm install`: faster on cached runs (skips
      # dependency resolution, installs exactly what the lockfile says) and
      # deterministic — refuses to run if package.json and package-lock.json
      # have drifted, which protects against accidental dependency surprises
      # on the production scraper.
      - run: npm ci
        # Playwright is a devDependency used ONLY by the manual, local IMLeagues
        # scraper (scripts/scrape-imleagues.js) — the cron never invokes it.
        # Skip its ~130MB browser (Chromium) download here: runners are
        # ephemeral and the browser binaries live in ~/.cache/ms-playwright,
        # which the npm cache (~/.npm) doesn't cover — so without this, every
        # hourly run would re-download a browser it never uses.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      # Sync curated event candidates from the "Event Candidates" Google Sheet
      # BEFORE scrape.js, because scrape.js READS the override files this
      # generates (borough-overrides.json, penn-manor-overrides.json,
      # youth-sports-registration.json). If this ran after the scrape, the
      # scraper would use stale overrides until the next hourly run.
      #
      # Only Approved-X'd rows are published; routes by the Source column.
      # continue-on-error + fail-safe script: a transient Google outage or bad
      # sheet never breaks the deploy, and the script exits without writing on
      # any error so the last-good committed JSON stays in place.
      #
      # NOTE: this OWNS the create-mode borough entries, all PM community
      # events, and all youth sports registrations — it overwrites those from
      # the sheet. Hand-maintained borough ENRICHMENT overrides (matchTitle
      # entries) are preserved by the script and still edited directly in JSON.
      - name: Sync event candidates from Google Sheet
        continue-on-error: true
        run: node scripts/sync-candidates.js
        env:
          CANDIDATES_SHEET_CSV_URL: ${{ secrets.CANDIDATES_SHEET_CSV_URL }}

      # Sync the business Directory from its Google Sheet (single source of
      # truth, maintained by hand in Sheets). Regenerates restaurants.json,
      # services.json, housing.json, campus-cupboard.json, and association.json
      # from one flat sheet — see
      # scripts/sync-directory.js. The commit step below picks these up via
      # `git add *.json` like any other data file.
      #
      # Order note: sync-directory runs BEFORE scrape.js. This was load-bearing
      # while scrape.js's business-review overlay wrote rating/reviewCount back
      # into services.json (whichever ran last got committed); that overlay was
      # removed 2026-07-13 with the review-system retirement, so the order is
      # now plain convention — scrape.js no longer touches the directory files.
      # Keeping sync-directory first stays the safe default if any future step
      # ever overlays onto directory output again.
      #
      # continue-on-error: a transient Google outage or a malformed sheet must
      # NOT fail the whole hourly deploy. The script itself fails safe — on any
      # fetch/parse/empty error it exits non-zero WITHOUT writing, so the last
      # good committed JSON stays in place and the site is unaffected.
      - name: Sync directory from Google Sheet
        continue-on-error: true
        run: node scripts/sync-directory.js
        env:
          DIRECTORY_SHEET_CSV_URL: ${{ secrets.DIRECTORY_SHEET_CSV_URL }}

      # Runs AFTER sync-directory (above) so scrape's services.json review
      # overlay is the final writer — do NOT move this above sync-directory.
      - run: node scripts/scrape.js
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json 2>/dev/null || true
          git diff --staged --quiet && echo "No changes to commit" || {
            git commit -m "System: Auto-syncing Community Data"
            git pull --rebase origin main --strategy-option theirs || {
              echo "Rebase conflict — resolving with ours (freshly scraped data wins)"
              git rebase --abort 2>/dev/null || true
              git pull origin main --no-rebase --strategy-option theirs
              git add *.json 2>/dev/null || true
              git commit -m "System: Auto-syncing Community Data (merge)" --allow-empty
            }
            git push origin main
          }

      # Minify app.js for production. Runs AFTER the git commit step on
      # purpose — the source-of-truth in the repo stays unminified for
      # diffability and local edits, but the file SFTP'd to DreamHost is
      # the minified version. We overwrite the working-copy app.js in place
      # so the deploy step picks it up automatically.
      #
      # Mangle is safe here: every HTML onclick handler references functions
      # via `window.X` (string property lookup, never mangled). Top-level
      # `function X()` declarations are only called internally so terser's
      # default mangling won't break anything. If you ever add an HTML
      # onclick that references a top-level function name directly, switch
      # to `--keep-fnames` here to be safe.
      #
      # Also sed-replaces the __BUILD_VERSION__ placeholder in sw.js with
      # this run's id so each deploy produces a byte-different service worker.
      # The browser detects the change and triggers an update — no manual
      # cache-version bumps. Sed on JS is fine; the rule "never sed HTML"
      # (which truncated index.html in the past) doesn't apply to JS files
      # without nested-bracket structure issues.
      #
      # terser is installed via `npm ci` above (devDependencies in package.json
      # pin it to ^5.46.1) so we don't redownload it each run and the version
      # is reproducible across runs.
      - name: Minify app.js and stamp SW version
        run: |
          npx terser app.js -o app.min.js -c -m
          mv app.min.js app.js
          echo "Minified app.js: $(wc -c < app.js) bytes"
          sed -i "s|__BUILD_VERSION__|${{ github.run_id }}|" sw.js
          echo "Stamped sw.js with build version ${{ github.run_id }}"

      - name: Deploy to DreamHost via SFTP
        run: |
          sudo apt-get install -y lftp
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt..."
            lftp -c "
              set sftp:auto-confirm yes;
              set net:max-retries 3;
              set net:timeout 30;
              set net:reconnect-interval-base 10;
              open -u ${{ secrets.DREAMHOST_USERNAME }},${{ secrets.DREAMHOST_PASSWORD }} sftp://${{ secrets.DREAMHOST_SERVER }};
              mirror --reverse --delete --verbose \
                --exclude ^\.git/ \
                --exclude ^\.github/ \
                --exclude ^\.claude/ \
                --exclude ^node_modules/ \
                --exclude ^scripts/ \
                --exclude ^package\.json$ \
                --exclude ^package-lock\.json$ \
                --exclude ^index_old\.html$ \
                --exclude ^style_old\.css$ \
                --exclude ^404\.html$ \
                --exclude ^candidates-status\.json$ \
                --exclude ^subscriptions\.json$ \
                --exclude ^notifications-status\.json$ \
                --exclude ^lib/eventJsonLd\.js$ \
                ./ ${{ secrets.DREAMHOST_DIR }};
              put -O ${{ secrets.DREAMHOST_DIR }} .htaccess;
              quit;
            " && echo "Deploy succeeded!" && break || {
              echo "Attempt $attempt failed, waiting 30s..."
              sleep 30
            }
          done

      # Post-deploy smoke test. Catches the "deploy succeeded but site is
      # actually broken" failure mode that source-health monitoring can't
      # see — e.g. a JS syntax error from a typo making index.html render
      # blank, or a corrupted events.json shipping zero events, or the
      # scraper succeeding but writing a stale status.json from an aborted
      # earlier run.
      #
      # Three checks against the live origin:
      #   1. index.html responds 200 and contains the brand string
      #   2. events.json is parseable and contains >100 entries
      #   3. status.json exists and its generatedAt timestamp is within
      #      the last 90 minutes (cron is hourly; 90min covers worst-case
      #      runtime + clock skew between runner and DreamHost)
      #
      # 8-second sleep gives DreamHost a moment to settle after lftp's
      # final TCP teardown — most deploys are visible immediately but
      # occasionally there's a brief window where the freshly-uploaded
      # file isn't yet served. Failing here flips the workflow red and
      # triggers the existing healthchecks.io /fail ping below.
      - name: Post-deploy smoke test
        run: |
          set -e
          echo "Waiting 8s for DreamHost to settle..."
          sleep 8

          BASE="https://millersville.app"
          FAILED=0

          # 1. index.html
          echo "▸ Checking index.html..."
          STATUS=$(curl -s -o /tmp/index.html -w "%{http_code}" --max-time 15 "$BASE/")
          if [ "$STATUS" != "200" ]; then
            echo "  ❌ HTTP $STATUS"
            FAILED=1
          elif ! grep -q 'Millersville.APP' /tmp/index.html; then
            echo "  ❌ 'Millersville.APP' not found in HTML — page may be rendering blank"
            head -c 500 /tmp/index.html
            FAILED=1
          else
            echo "  ✓ index.html OK"
          fi

          # 1b. SPA route rewrite. Loading /events directly (not /) requires
          # mod_rewrite to match line 18 of .htaccess and serve index.html.
          # This silently broke for ~2 weeks once when the file on DreamHost
          # got renamed to Index.html (capital I) by some filesystem-case
          # confusion — the rewrite pointed at lowercase, which didn't exist,
          # and only the home page (served via DirectoryIndex matching either
          # case) kept working. The previous smoke test only hit "$BASE/" so
          # nothing flagged it. This catches the regression.
          # We use /events specifically because that route also has shareable
          # URL filter state (?kid=1, ?src=Borough, etc.) — if /events serves
          # index.html, the rest of the SPA routes will too.
          echo "▸ Checking /events SPA route..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$BASE/events")
          if [ "$STATUS" != "200" ]; then
            echo "  ❌ /events returned HTTP $STATUS — SPA rewrite broken (check .htaccess and that index.html is lowercase on the server)"
            FAILED=1
          else
            echo "  ✓ /events route OK"
          fi

          # 2. events.json
          echo "▸ Checking events.json..."
          STATUS=$(curl -s -o /tmp/events.json -w "%{http_code}" --max-time 15 "$BASE/events.json")
          if [ "$STATUS" != "200" ]; then
            echo "  ❌ HTTP $STATUS"
            FAILED=1
          else
            COUNT=$(jq -r 'length // 0' /tmp/events.json 2>/dev/null || echo 0)
            if [ "$COUNT" -lt 100 ]; then
              echo "  ❌ events.json has only $COUNT entries (expected >100)"
              FAILED=1
            else
              echo "  ✓ events.json has $COUNT entries"
            fi
          fi

          # 3. status.json freshness
          echo "▸ Checking status.json freshness..."
          STATUS=$(curl -s -o /tmp/status.json -w "%{http_code}" --max-time 15 "$BASE/status.json")
          if [ "$STATUS" != "200" ]; then
            echo "  ❌ HTTP $STATUS"
            FAILED=1
          else
            GEN=$(jq -r '.generatedAt // empty' /tmp/status.json)
            if [ -z "$GEN" ]; then
              echo "  ❌ status.json missing generatedAt"
              FAILED=1
            else
              # Convert generatedAt (ISO-8601) to epoch seconds, compute
              # delta in minutes. macOS-incompatible date flags are fine
              # here since runners are Ubuntu.
              GEN_EPOCH=$(date -d "$GEN" +%s)
              NOW_EPOCH=$(date +%s)
              AGE_MIN=$(( (NOW_EPOCH - GEN_EPOCH) / 60 ))
              if [ "$AGE_MIN" -gt 90 ]; then
                echo "  ❌ status.json is $AGE_MIN minutes old (limit 90)"
                FAILED=1
              else
                echo "  ✓ status.json fresh ($AGE_MIN min ago)"
              fi
            fi
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "❌ Post-deploy smoke test FAILED — see checks above"
            exit 1
          fi
          echo ""
          echo "✓ All post-deploy checks passed"

      # Fast-fail alert. The scraper already pings HEALTHCHECK_URL on success
      # (see scrape.js). If the whole job crashes before that ping, healthchecks.io
      # will eventually fire its dead-man alert after the grace period — but this
      # step sends an explicit /fail ping immediately so we hear about it in
      # seconds rather than waiting 30+ minutes. `if: failure()` means it only
      # runs when a prior step failed; `|| true` guarantees the ping itself
      # never flips a successful job red.
      - name: Ping healthchecks.io on failure
        if: failure()
        run: |
          if [ -n "${{ secrets.HEALTHCHECK_URL }}" ]; then
            curl -fsS -m 10 --retry 3 "${{ secrets.HEALTHCHECK_URL }}/fail" || true
          fi
