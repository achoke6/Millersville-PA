<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Status · Millersville.APP</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="style.css">
<style>
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .status-container { max-width: 900px; margin: 0 auto; }
    .status-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .status-header h1 { font-size: 1.5rem; margin: 0; color: var(--navy); }
    .status-badge { padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; }
    .status-badge.ok { background: #dcfce7; color: #166534; }
    .status-badge.warn { background: #fef3c7; color: #92400e; }
    .status-badge.err { background: #fee2e2; color: #991b1b; }
    .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .status-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .status-card h2 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin: 0 0 10px; font-weight: 700; }
    .status-metric { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
    .status-metric:last-child { border-bottom: none; }
    .status-metric-label { color: var(--text); }
    .status-metric-value { font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
    .status-metric-value.zero { color: var(--text-muted); font-weight: 400; }
    .status-hero { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .status-hero-big { font-size: 2rem; font-weight: 800; color: var(--navy); line-height: 1; }
    .status-hero-label { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-top: 4px; }
    .status-meta { font-size: 0.82rem; color: var(--text-muted); text-align: center; padding: 20px 0; }
    .status-meta a { color: var(--navy); }
    .status-error { padding: 20px; background: #fee2e2; border: 1px solid #fca5a5; border-radius: var(--radius); color: #991b1b; }
    /* Per-source degradation styling. Applied to rows in the "Events by
       Source" card when today's count is well below the historical median.
       The hint span shows the typical baseline so the user has context for
       the drop without leaving the page. */
    .status-metric.warn { background: #fffbeb; border-left: 3px solid #f59e0b; padding-left: 7px; }
    .status-metric.err  { background: #fef2f2; border-left: 3px solid #dc2626; padding-left: 7px; }
    .status-metric .status-metric-hint { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 400; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .status-metric.warn .status-metric-value { color: #92400e; }
    .status-metric.err  .status-metric-value { color: #991b1b; }
    /* Sources-health pill below the hero. Different from the freshness badge
       — that one only knows the timestamp; this one knows whether per-source
       counts look reasonable. A scrape can be timestamp-fresh but have a
       source quietly returning zero, which is the failure mode this catches. */
    .status-health-row { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: var(--radius); margin-bottom: 16px; font-size: 0.86rem; }
    .status-health-row.ok   { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .status-health-row.warn { background: #fffbeb; color: #92400e; border: 1px solid #fcd34d; }
    .status-health-row.err  { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }
    .status-health-row.muted { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); }
</style>
</head>
<body>
<div class="status-container">
    <div class="status-header">
        <h1>📊 Millersville.APP Status</h1>
        <span id="freshness-badge" class="status-badge ok">Loading…</span>
    </div>

    <div id="hero-block" class="status-hero">
        <div>
            <div id="hero-events" class="status-hero-big">—</div>
            <div class="status-hero-label">Events live</div>
        </div>
        <div>
            <div id="hero-time" class="status-hero-big" style="font-size:1rem;line-height:1.4;">—</div>
            <div class="status-hero-label">Last scrape</div>
        </div>
    </div>

    <div id="health-row" class="status-health-row muted" style="display:none;">Loading source health…</div>

    <div id="grid" class="status-grid"></div>

    <div class="status-meta">
        <a href="/">← Back to site</a> · Auto-refreshes every 60s ·
        <a href="https://github.com/achoke6/Millersville-PA/actions" target="_blank">GitHub Actions</a>
    </div>
</div>

<script>
// Freshness thresholds. Cron runs hourly; we tolerate up to 75 minutes as OK
// (gives the scrape itself ~10 mins of runtime buffer), yellow from 75-180 min
// meaning "at least one run skipped", red past 3 hours meaning "repeatedly
// failing".
const OK_MAX_MIN = 75;
const WARN_MAX_MIN = 180;

function formatRelative(iso) {
    const now = Date.now();
    const then = new Date(iso).getTime();
    if (isNaN(then)) return 'unknown';
    const minAgo = Math.round((now - then) / 60000);
    if (minAgo < 1) return 'just now';
    if (minAgo < 60) return minAgo + ' min ago';
    const hrAgo = Math.floor(minAgo / 60);
    if (hrAgo < 24) return hrAgo + 'h ' + (minAgo % 60) + 'm ago';
    const dayAgo = Math.floor(hrAgo / 24);
    return dayAgo + ' day' + (dayAgo > 1 ? 's' : '') + ' ago';
}

function metric(label, value, opts) {
    opts = opts || {};
    const valStr = value == null ? '—' : String(value);
    const isZero = value === 0;
    // opts.status is one of 'warn' | 'err' | undefined. Adds a class to the
    // row and a colored value pill. opts.hint renders below the value in
    // small muted text — typically used to show the historical baseline
    // when today's count is degraded ("typical 87" alongside today's 0).
    const rowClass = 'status-metric' + (opts.status ? ' ' + opts.status : '');
    const hint = opts.hint ? '<span class="status-metric-hint">' + opts.hint + '</span>' : '';
    return '<div class="' + rowClass + '"><span class="status-metric-label">' + label +
           '</span><span class="status-metric-value' + (isZero ? ' zero' : '') + '">' + valStr +
           (opts.suffix || '') + hint + '</span></div>';
}

// Median of a numeric array. Returns 0 for empty input. We don't bother
// averaging the two middle elements on even-length arrays — for a 6-element
// historical window the "high middle" is fine and simpler.
function median(nums) {
    if (!nums.length) return 0;
    const sorted = [...nums].sort((a, b) => a - b);
    return sorted[Math.floor(sorted.length / 2)];
}

// Compare today's value for a source against historical median, return
// { status, hint } if degraded, or null if within tolerance / not enough
// data. NOISE_FLOOR exists so naturally-low sources (VFW with 1-2 events
// at a time, occasional Phantom Power gaps) don't trigger spurious alarms
// — we only flag drops on sources that ROUTINELY have meaningful volume.
const NOISE_FLOOR = 4;
function compareSource(currentValue, history, sourceKey, todayDate) {
    if (currentValue == null || !history || !Array.isArray(history.days)) return null;
    // Exclude today's entry (history may already include it from this run).
    const priorDays = history.days.filter(d => d.date !== todayDate);
    if (priorDays.length < 2) return null;  // not enough baseline yet
    const priorCounts = priorDays.map(d => (d.sources && d.sources[sourceKey]) || 0);
    const med = median(priorCounts);
    if (med < NOISE_FLOOR) return null;  // baseline too low to be diagnostic
    const ratio = currentValue / med;
    if (currentValue === 0 || ratio < 0.1) return { status: 'err',  hint: `↓ typical ${med}/day` };
    if (ratio < 0.5)                       return { status: 'warn', hint: `↓ typical ${med}/day` };
    return null;
}

// Format a date range from sourceDateRanges into a compact human label.
// Same year: "Mar 4 → Apr 28". Cross-year: "Sep 15, 2025 → Aug 30, 2026".
// Returns null if the range is missing or invalid (caller renders no hint).
// Single-day ranges (earliest === latest) collapse to one date — rare for
// real sources but happens for VFW when only one flyer is current.
function formatDateRange(range) {
    if (!range || !range.earliest || !range.latest) return null;
    const start = new Date(range.earliest);
    const end = new Date(range.latest);
    if (isNaN(start.getTime()) || isNaN(end.getTime())) return null;
    const sameYear = start.getFullYear() === end.getFullYear();
    const fmtSame = { month: 'short', day: 'numeric' };
    const fmtCross = { month: 'short', day: 'numeric', year: 'numeric' };
    const opts = sameYear ? fmtSame : fmtCross;
    const startStr = start.toLocaleDateString('en-US', opts);
    const endStr = end.toLocaleDateString('en-US', opts);
    if (startStr === endStr) return startStr;
    return `${startStr} → ${endStr}`;
}

function card(title, rows) {
    return '<div class="status-card"><h2>' + title + '</h2>' + rows + '</div>';
}

async function render() {
    let status, history = null, notificationsStatus = null, autoEventsStatus = null;
    try {
        // Bust the cache explicitly — we want fresh numbers, not hourly CDN-
        // cached snapshots. The scraper writes these files as the last step
        // of each cron run so "just now" fetches should see new data.
        // Fetch status and history in parallel. History is informational —
        // a 404 (e.g., first deploy before any cron has written it) just
        // skips the comparison logic and renders raw counts as before.
        //
        // notifications-status.json: written by the daily 7am push cron.
        // auto-events-status.json: written by the weekly Sunday auto-scraper.
        // Both are optional — 404 just means that cron hasn't successfully
        // run yet (e.g., first deploy, or auto-scraper still dormant), and
        // the corresponding card is omitted instead of showing an error.
        const [statusRes, historyRes, notifRes, autoRes] = await Promise.all([
            fetch('status.json?' + Date.now(), { cache: 'no-store' }),
            fetch('status-history.json?' + Date.now(), { cache: 'no-store' }).catch(() => null),
            fetch('notifications-status.json?' + Date.now(), { cache: 'no-store' }).catch(() => null),
            fetch('auto-events-status.json?' + Date.now(), { cache: 'no-store' }).catch(() => null)
        ]);
        if (!statusRes.ok) throw new Error('status.json HTTP ' + statusRes.status);
        status = await statusRes.json();
        if (historyRes && historyRes.ok) {
            try { history = await historyRes.json(); } catch { /* malformed — ignore */ }
        }
        if (notifRes && notifRes.ok) {
            // Validate JSON shape — DreamHost serves HTML 404 pages with 200
            // OK on some configurations, which would otherwise blow up the
            // JSON parse and kill the whole render. Same defensive pattern
            // as the cron notification idempotency check.
            try {
                const text = await notifRes.text();
                if (text.trimStart().startsWith('{')) notificationsStatus = JSON.parse(text);
            } catch { /* malformed — ignore */ }
        }
        if (autoRes && autoRes.ok) {
            try {
                const text = await autoRes.text();
                if (text.trimStart().startsWith('{')) autoEventsStatus = JSON.parse(text);
            } catch { /* malformed — ignore */ }
        }
    } catch (err) {
        document.getElementById('grid').innerHTML =
            '<div class="status-error"><strong>Status file unavailable.</strong> Either the scraper hasn\'t run yet, or the status.json file is missing. Error: ' +
            err.message + '</div>';
        document.getElementById('freshness-badge').textContent = 'No data';
        document.getElementById('freshness-badge').className = 'status-badge err';
        return;
    }

    // Hero: event count + last-updated + freshness badge
    document.getElementById('hero-events').textContent = status.totalEvents.toLocaleString();
    document.getElementById('hero-time').textContent = formatRelative(status.generatedAt);
    const minAgo = Math.round((Date.now() - new Date(status.generatedAt).getTime()) / 60000);
    const badge = document.getElementById('freshness-badge');
    if (minAgo <= OK_MAX_MIN) {
        badge.textContent = '● Healthy';
        badge.className = 'status-badge ok';
    } else if (minAgo <= WARN_MAX_MIN) {
        badge.textContent = '● Stale (1+ runs missed)';
        badge.className = 'status-badge warn';
    } else {
        badge.textContent = '● Failing (3+ hours)';
        badge.className = 'status-badge err';
    }

    // Per-section cards
    const s = status.sources || {};
    const sp = status.sports || {};

    // Per-source degradation check. The same labels that appear on the
    // dashboard map to the keys in status.sources. todayDate is derived in
    // the browser but uses Intl.DateTimeFormat with America/New_York so it
    // matches the deriveDayET key the scraper wrote — important for users
    // viewing the page late at night when local time and ET disagree.
    const todayDate = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date()).replace(/\//g, '-');
    const sourceList = [
        { label: 'MU Athletics',           key: 'muAthletics' },
        { label: 'MU Calendar',            key: 'muCalendar' },
        { label: 'MU GetInvolved',         key: 'muGetInvolved' },
        { label: 'Penn Manor',             key: 'pennManor' },
        { label: 'Borough',                key: 'borough' },
        { label: 'VFW',                    key: 'vfw' },
        { label: 'Phantom Power',          key: 'phantomPower' },
        { label: 'Community submissions',  key: 'community' },
        // Enrichment row, not a source — counts MU athletic events that got
        // a Hudl/PSAC streamLink this run. Same compareSource() degradation
        // logic flags it if the count drops well below the 7-day median, so
        // a silent Hudl API change (like the one that broke this for months)
        // gets caught next cron instead of next baseball season.
        { label: 'MU Hudl broadcasts',     key: 'muHudlBroadcasts' }
    ];
    const degraded = [];
    const sourceRanges = status.sourceDateRanges || {};
    const sourceRows = sourceList.map(({ label, key }) => {
        const cmp = compareSource(s[key], history, key, todayDate);
        if (cmp) degraded.push({ label, status: cmp.status });
        // Combine degradation hint with date-range hint. Degradation wins
        // visual priority (the row is colored warn/err) but we still want
        // the user to know what time window the count covers. muHudlBroadcasts
        // has no date range (it's an enrichment count) and skips this hint.
        const rangeStr = formatDateRange(sourceRanges[key]);
        const opts = cmp ? { ...cmp } : {};
        if (rangeStr) {
            opts.hint = opts.hint ? `${opts.hint} · ${rangeStr}` : rangeStr;
        }
        return metric(label, s[key], opts);
    }).join('');

    // Health row: summary of source health independent of timestamp freshness.
    // Three states the user actually cares about:
    //   - All sources within tolerance       → "All sources healthy"
    //   - Some warns, no errors              → "N source(s) degraded"
    //   - At least one error                 → "N source(s) failing" (red)
    // Muted "Insufficient history" appears for the first ~2 days after deploy
    // when there isn't enough baseline data to compare against.
    const healthRow = document.getElementById('health-row');
    const hasErr  = degraded.some(d => d.status === 'err');
    const hasWarn = degraded.some(d => d.status === 'warn');
    healthRow.style.display = '';
    if (!history || (history.days || []).filter(d => d.date !== todayDate).length < 2) {
        healthRow.className = 'status-health-row muted';
        healthRow.textContent = '⏳ Building source-health baseline (need 2+ days of history to flag drops)';
    } else if (hasErr) {
        healthRow.className = 'status-health-row err';
        const failing = degraded.filter(d => d.status === 'err').map(d => d.label);
        healthRow.textContent = `🚨 ${failing.length} source${failing.length > 1 ? 's' : ''} failing: ${failing.join(', ')}`;
    } else if (hasWarn) {
        healthRow.className = 'status-health-row warn';
        const warning = degraded.filter(d => d.status === 'warn').map(d => d.label);
        healthRow.textContent = `⚠️ ${warning.length} source${warning.length > 1 ? 's' : ''} degraded: ${warning.join(', ')}`;
    } else {
        healthRow.className = 'status-health-row ok';
        healthRow.textContent = '✓ All sources within typical range';
    }

    const sourcesCard = card('Events by Source', sourceRows);

    // Overall date range across all sport events (MU + PM + Clubs combined).
    // sources.muAthletics has its own range above; this one annotates the
    // Sports Results card's "Total sport events" line so the same "what
    // window does 247 cover?" question is answered there too.
    const allSportRanges = ['muAthletics', 'pennManor'].map(k => sourceRanges[k]).filter(Boolean);
    let sportTotalRange = null;
    if (allSportRanges.length > 0) {
        // Approximate: union of MU athletics and Penn Manor ranges. Doesn't
        // perfectly capture Clubs/Orgs sport events (those live under MU
        // Clubs/Orgs umbrella with a Sports tag) but covers the bulk and is
        // good enough for a status-page hint.
        sportTotalRange = {
            earliest: allSportRanges.map(r => r.earliest).sort()[0],
            latest: allSportRanges.map(r => r.latest).sort().pop()
        };
    }
    const sportRangeStr = formatDateRange(sportTotalRange);

    const sportsCard = card('Sports Results',
        metric('Total sport events', sp.total, sportRangeStr ? { hint: sportRangeStr } : {}) +
        metric('Scored (past games)', sp.scored) +
        metric('Wins', sp.wins) +
        metric('Losses', sp.losses) +
        metric('Ties / Neutral', sp.ties) +
        metric('Box scores parsed', sp.boxScoresParsed,
            { suffix: sp.scored ? ' / ' + sp.scored + ' (' + Math.round(sp.boxScoresParsed / sp.scored * 100) + '%)' : '' })
    );

    const contentCard = card('Content Coverage',
        metric('With description', status.withDescription,
            { suffix: ' / ' + status.totalEvents + ' (' + Math.round(status.withDescription / status.totalEvents * 100) + '%)' }) +
        metric('With image', status.withImage,
            { suffix: ' / ' + status.totalEvents + ' (' + Math.round(status.withImage / status.totalEvents * 100) + '%)' }) +
        metric('Family-friendly tagged', status.familyFriendly)
    );

    // Notifications card — daily 7am ET push cron. Cadence: every day, so a
    // run older than ~36 hours means at least one day was skipped. The cron's
    // own idempotency guard means we should normally see one fresh lastRunAt
    // per ET calendar day, so missed runs stand out.
    let notificationsCard = '';
    if (notificationsStatus) {
        const ns = notificationsStatus;
        const lastRunRel = ns.lastRunAt ? formatRelative(ns.lastRunAt) : 'never';
        const minSinceRun = ns.lastRunAt ? (Date.now() - new Date(ns.lastRunAt).getTime()) / 60000 : Infinity;
        // Daily run: warn at 36h (skipped a day), err at 72h (skipped 3 days).
        let runStatus = {};
        if (minSinceRun > 72 * 60) runStatus = { status: 'err' };
        else if (minSinceRun > 36 * 60) runStatus = { status: 'warn' };
        notificationsCard = card('Daily Push Notifications',
            metric('Last run', lastRunRel, runStatus) +
            metric('Sent',         ns.lastRunSent ?? '—') +
            metric('Skipped (no matches)', ns.lastRunSkipped ?? '—') +
            metric('Pruned (dead)', ns.lastRunPruned ?? '—',
                (ns.lastRunPruned || 0) > 0 ? { hint: '410 Gone — cleaned up' } : {}) +
            metric('Subscribers',  ns.subscribers ?? '—')
        );
    }

    // Weekly auto-scraper card — Sunday 7am UTC cron. Cadence: weekly, so a
    // run older than ~9 days means at least one weekly run was missed; >16d
    // means two missed. Per-parser breakdown surfaces parser-specific
    // breakage (alumni HTML changed, tech-camps blocked by Cloudflare, etc.)
    // separately from "the whole job didn't run."
    let autoScraperCard = '';
    if (autoEventsStatus) {
        const as = autoEventsStatus;
        const lastRunRel = as.lastRunAt ? formatRelative(as.lastRunAt) : 'never';
        const minSinceRun = as.lastRunAt ? (Date.now() - new Date(as.lastRunAt).getTime()) / 60000 : Infinity;
        // Weekly run: warn at 9d (missed one Sunday), err at 16d (missed two).
        let runStatus = {};
        if (minSinceRun > 16 * 24 * 60) runStatus = { status: 'err' };
        else if (minSinceRun > 9 * 24 * 60) runStatus = { status: 'warn' };

        const parserRows = (as.parsers || []).map(p => {
            const opts = {};
            if (p.error) {
                opts.status = 'err';
                // Trim error message for compact display — full text is in
                // GitHub Actions logs if needed.
                const msg = p.error.length > 60 ? p.error.substring(0, 57) + '…' : p.error;
                opts.hint = 'error: ' + msg;
            }
            return metric(p.name, p.count, opts);
        }).join('');

        const totalOpts = {};
        if (as.skippedUpload) {
            totalOpts.status = 'err';
            totalOpts.hint = 'upload skipped — refused to overwrite with empty';
        }
        autoScraperCard = card('Weekly Auto-Scraper',
            metric('Last run', lastRunRel, runStatus) +
            metric('Total events scraped', as.eventCount ?? 0, totalOpts) +
            (parserRows || '<div class="status-metric muted"><span class="status-metric-label">No parser data</span></div>')
        );
    }

    // Recent Additions card — operator self-check. Shows events the scraper
    // found in the last few cron runs. Useful for confirming the pipeline is
    // actively finding fresh content. addedLastRun shows the count of brand-
    // new events in the most recent cron specifically. recentlyAdded shows
    // a rolling 7-day window of additions (most recent first, up to 10).
    //
    // The recentlyAdded array is built incrementally by the scraper from
    // events-snapshot.json — a per-cron diff that ages out after 7 days. If
    // status.recentlyAdded is missing (e.g. status.json was written before
    // this feature shipped, or the diff tracking errored), the card just
    // doesn't render.
    let recentAddedCard = '';
    if (Array.isArray(status.recentlyAdded)) {
        const items = status.recentlyAdded.slice(0, 6);
        const itemRows = items.length === 0
            ? '<div class="status-metric muted"><span class="status-metric-label">No additions in last 7 days</span></div>'
            : items.map(item => {
                // Truncate long titles so the row stays compact. Source pill
                // goes on the right via the value slot. Time-relative hint
                // ("3h ago") goes below as the metric hint.
                const title = (item.title || '(untitled)').length > 50
                    ? item.title.substring(0, 47) + '…'
                    : (item.title || '(untitled)');
                const when = item.firstSeenAt ? formatRelative(item.firstSeenAt) : '';
                return metric(title, item.source || 'Other', { hint: when });
            }).join('');

        // The "Added in this run" count is the top-line metric. 0 is normal
        // most hours (no new events). A high number is a healthy signal of
        // active scraping.
        const lastRunOpts = {};
        if (status.addedLastRun === 0) {
            // Don't flag — most hours genuinely have 0 new events. But a
            // hint here would be misleading either way. Leave as just '0'.
        }

        recentAddedCard = card('Recent Additions (7d)',
            metric('Added in this run', status.addedLastRun ?? 0, lastRunOpts) +
            itemRows
        );
    }

    document.getElementById('grid').innerHTML = sourcesCard + sportsCard + contentCard + notificationsCard + autoScraperCard + recentAddedCard;
}

render();
// Poll every 60s. The scrape runs hourly, so we won't see data update most
// of the time — but it's useful around the top of the hour to watch the
// refresh happen without manually reloading.
setInterval(render, 60000);
</script>
</body>
</html>
