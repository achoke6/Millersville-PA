<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millersville, PA</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-link.active { border-bottom: 3px solid var(--accent-fresh) !important; color: var(--text-dark) !important; font-weight: bold; }
        .live-badge { position: absolute; top: 12px; right: 12px; background: rgba(239, 68, 68, 0.9); color: white; padding: 4px 10px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; z-index: 10; display: flex; align-items: center; gap: 5px; }
    </style>
</head>
<body onload="initApp()">

<header>
    <div class="header-container">
        <div class="logo-block">
            <h1>Millersville, PA</h1>
            <p id="sub-header">MU Student View: Campus App</p>
        </div>
        <nav class="main-nav">
            <button id="nav-home" class="nav-link active" onclick="switchView('home')">Home</button>
            <button id="nav-news" class="nav-link" onclick="switchView('news')">News</button>
            <button id="nav-events" class="nav-link" onclick="switchView('events')">Events</button>
            <button id="nav-food" class="nav-link" onclick="switchView('food')">Dining</button>
            <button id="nav-housing" class="nav-link" onclick="switchView('housing')">Housing</button>
            <button id="nav-services" class="nav-link" onclick="switchView('services')">Services</button>
            <button id="nav-weather" class="nav-link" onclick="switchView('weather')">Weather</button>
        </nav>
        <div class="header-toggle">
            <span class="mode-label">MU STUDENT</span>
            <label class="toggle-container">
                <input type="checkbox" id="roleToggle" onchange="toggleMode()">
                <span class="toggle-slider"></span>
            </label>
            <span class="mode-label">TOWNIE</span>
        </div>
    </div>
</header>

<main class="container">
    <section id="view-home" class="app-view active">
        <div id="home-weather" style="background: var(--theme-color); color: white; padding: 20px; border-radius: 16px; margin-bottom: 20px;">Loading Weather...</div>
        <div id="home-events" class="events-grid"></div>
    </section>

    <section id="view-food" class="app-view"><div id="food-container" class="events-grid">Loading Dining...</div></section>
    <section id="view-weather" class="app-view">
        <div class="app-card" style="text-align:center; margin-bottom:20px;">
            <h2 id="w-temp" style="font-size:3rem;">--°F</h2>
            <p id="w-cond"></p>
        </div>
        <div style="position: relative; border-radius: 16px; overflow: hidden; background: #000;">
            <div class="live-badge">LIVE</div>
            <img id="cam-img" src="https://snowball.millersville.edu/~cws/wxcam/latest.jpeg" style="width: 100%; display: block;">
        </div>
    </section>

    <section id="view-news" class="app-view"><div id="news-container" class="events-grid"></div></section>
    <section id="view-events" class="app-view"><div id="events-container" class="events-grid"></div></section>
    <section id="view-housing" class="app-view"><div id="housing-container" class="events-grid"></div></section>
    <section id="view-services" class="app-view"><div id="services-container" class="events-grid"></div></section>
</main>

<script>
    let currentEvents = [], currentFilter = 'All';

    // NAV FIX: This logic explicitly matches the ID of the button
    function switchView(view) {
        document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
        document.getElementById(`view-${view}`).classList.add('active');
        
        document.querySelectorAll('.nav-link').forEach(btn => {
            btn.classList.remove('active');
        });
        // Match nav-home, nav-food, etc.
        const activeBtn = document.getElementById(`nav-${view}`);
        if(activeBtn) activeBtn.classList.add('active');
    }

    async function loadData(file, callback) {
        try {
            const res = await fetch(file);
            const data = await res.json();
            callback(data);
        } catch (e) { console.error(`Error loading ${file}`); }
    }

    async function initApp() {
        loadData('weather.json', data => {
            document.getElementById('home-weather').innerHTML = `<h3>${data.temp}°F</h3><p>${data.condition}</p>`;
            document.getElementById('w-temp').innerText = `${data.temp}°F`;
            document.getElementById('w-cond').innerText = data.condition;
        });
        loadData('events.json', data => {
            currentEvents = data;
            renderEventsUI();
        });
        loadData('restaurants.json', renderDiningUI);
        loadData('housing.json', renderHousingUI);
        loadData('services.json', renderServicesUI);
    }

    function toggleMode() {
        const isT = document.getElementById('roleToggle').checked;
        document.body.classList.toggle('townie-mode', isT);
        renderEventsUI();
    }

    // Include your specific render functions (Dining, Housing, etc.) here
    function renderDiningUI(data) {
        const container = document.getElementById('food-container');
        container.innerHTML = '';
        data.forEach(item => {
            container.innerHTML += `<div class="app-card"><h3>${item.name}</h3><p>${item.cuisine}</p><a href="${item.link}" target="_blank">Menu</a></div>`;
        });
    }

    function renderEventsUI() {
        const container = document.getElementById('events-container');
        const homeContainer = document.getElementById('home-events');
        const isT = document.getElementById('roleToggle').checked;
        container.innerHTML = '';
        homeContainer.innerHTML = '';

        currentEvents.forEach(e => {
            if (!isT && e.category === 'Penn Manor') return;
            const card = `<div class="app-card"><h4>${e.title}</h4><p>${e.location}</p></div>`;
            container.innerHTML += card;
        });
    }
</script>
</body>
</html>
