name: Millersville Data Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env: # This line silences the warning
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # This fixes Exit Code 128
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4 # This was the error; setup-node is the correct action
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install axios cheerio

      - name: Run Scraper
        run: node scripts/scrape.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Auto-update Millersville events" || exit 0
          git push