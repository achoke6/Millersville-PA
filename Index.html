<style>
    .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .filter-btn { 
        padding: 8px 12px; border: 2px solid var(--primary); 
        background: transparent; color: var(--secondary); 
        cursor: pointer; border-radius: 20px; font-weight: bold;
    }
    .filter-btn.active { background: var(--primary); color: white; }
    .pagination { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
    .page-link { cursor: pointer; color: var(--primary); font-weight: bold; text-decoration: underline; }
</style>

<div class="filter-bar" id="filterBar">
    <button class="filter-btn active" onclick="setFilter('All')">All</button>
    <button class="filter-btn" onclick="setFilter('Arts Concert / Performance')">Arts</button>
    <button class="filter-btn" onclick="setFilter('Athletic Competitions')">Sports</button>
    <button class="filter-btn" onclick="setFilter('Public Event')">Public</button>
    <button class="filter-btn" onclick="setFilter('Student Event')">Students</button>
</div>

<div id="events-container"></div>
<div class="pagination" id="pagination"></div>

<script>
    let currentFilter = 'All';
    let currentPage = 1;
    const itemsPerPage = 5;

    function setFilter(cat) {
        currentFilter = cat;
        currentPage = 1;
        renderUI();
        // Update active class on buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.innerText.includes(cat) || (cat === 'All' && btn.innerText === 'All'));
        });
    }

    function renderUI() {
        const isTownie = document.getElementById('roleToggle').checked;
        const container = document.getElementById('events-container');
        
        // 1. Filter Logic
        let filtered = currentEvents.filter(event => {
            // Rule: Townies never see Student Events
            if (isTownie && event.category === "Student Event") return false;
            // Category Filter
            if (currentFilter !== 'All' && event.category !== currentFilter) return false;
            return true;
        });

        // 2. Pagination Logic
        const start = (currentPage - 1) * itemsPerPage;
        const paginatedItems = filtered.slice(start, start + itemsPerPage);

        // 3. Generate HTML
        container.innerHTML = paginatedItems.map(event => `
            <div class="card">
                <span class="price-tag">${event.category}</span>
                <h3>${event.name}</h3>
                <p><strong>🕒 Time:</strong> ${event.time}</p>
                <p><strong>📍 Location:</strong> ${event.loc}</p>
            </div>
        `).join('');

        renderPagination(filtered.length);
    }

    function renderPagination(totalItems) {
        const totalPages = Math.ceil(totalItems / itemsPerPage);
        const nav = document.getElementById('pagination');
        nav.innerHTML = '';
        for (let i = 1; i <= totalPages; i++) {
            nav.innerHTML += `<span class="page-link" onclick="goToPage(${i})">${i}</span>`;
        }
    }

    function goToPage(p) {
        currentPage = p;
        renderUI();
        window.scrollTo(0,0);
    }
</script>
