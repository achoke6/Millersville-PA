<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millersville One-Stop</title>
    <style>
        /* --- CSS THEME VARIABLES --- */
        :root {
            --primary: #FFD100; /* Marauder Gold */
            --secondary: #000000;
            --bg: #ffffff;
            --card-bg: #f9f9f9;
            --btn-hover: #e6bc00;
        }

        body.townie-mode {
            --primary: #004a99; /* Borough Blue */
            --secondary: #2e7d32; /* Park Green */
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --btn-hover: #003a7a;
        }

        /* --- LAYOUT --- */
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: #333;
            margin: 0;
            padding-bottom: 120px;
            transition: background 0.3s ease;
        }

        header {
            background-color: var(--secondary);
            color: white;
            padding: 2.5rem 1rem;
            text-align: center;
            border-bottom: 8px solid var(--primary);
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 20px;
        }

        /* --- CONTROLS --- */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

            color: var(--primary);
            font-size: 1.2rem;
