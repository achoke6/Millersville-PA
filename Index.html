<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millersville One-Stop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="initApp()">

<header>
    <h1>Millersville One-Stop</h1>
    <p id="sub-header">Student View: Campus Events</p>
</header>

<div class="container">
    <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-cat="All" onclick="setFilter('All')">All</button>
        <button class="filter-btn" data-cat="Arts" onclick="setFilter('Arts')">Arts</button>
        <button class="filter-btn" data-cat="Athletic" onclick="setFilter('Athletic')">Sports</button>
        <button class="filter-btn" data-cat="Public" onclick="setFilter('Public')">Public</button>
        <button class="filter-btn" id="btn-student" data-cat="Student" onclick="setFilter('Student')">Students</button>
    </div>

    <div class="date-filter-container">
        <input type="date" id="datePicker" class="date-picker" onchange="filterByDate()">
        <button class="clear-date-btn" onclick="clearDateFilter()">Clear Date</button>
    </div>

    <div id="events-container">
        <p style="text-align:center; color:var(--text-muted);">Loading events from API...</p>
    </div>
    <div class="pagination" id="pagination"></div>
</div>

<div class="footer-switch">
    <span class="mode-label">STUDENT</span>
    <label class="toggle-container">
        <input type="checkbox" id="roleToggle" onchange="toggleMode()">
        <span class="toggle-slider"></span>
    </label>
    <span class="mode-label">TOWNIE</span>
</div>

<script>
    // --- APP STATE ---
    let currentEvents = [];
    let currentFilter = 'All';
    let currentDateFilter = '';
    let currentPage = 1;
    const itemsPerPage = 6;

    // --- INITIALIZATION ---
    async function initApp() {
        try {
            // Fetch the JSON generated by your GitHub Action
            const res = await fetch('events.json?v=' + Date.now());
            const rawApiData = await res.json();
            
            // Map the raw database array to our clean card format
if (rawApiData && rawApiData.data) {
                currentEvents = rawApiData.data.map(item => {
                    return {
                        name: item[1] || "Unnamed Event",
                        date: formatDate(item[3]),
                        rawDate: item[3] ? item[3].split('T')[0] : "", 
                        time: formatTime(item[3], item[4]),
                        loc: cleanLocation(item[5], item[7]),
                        category: item[9] || "Public Event",
                        // item[11] is the description field. We pass it to our new scanner!
                        price: extractPrice(item[11]) 
                    };
                });
            }
            renderUI();
        } catch (e) { 
            console.error("Data load failed:", e); 
            document.getElementById('events-container').innerHTML = `<p style="text-align:center; padding:2rem;">Waiting for GitHub Action to pull data...</p>`;
        }
    }

    // --- FORMATTING HELPERS ---
    function formatDate(dateStr) {
        if (!dateStr) return "TBA";
        const options = { weekday: 'short', month: 'short', day: 'numeric' };
        return new Date(dateStr.split('T')[0] + "T00:00:00").toLocaleDateString(undefined, options);
    }

    function formatTime(startStr, endStr) {
        if (!startStr) return "TBA";
        const options = { hour: 'numeric', minute: '2-digit', hour12: true };
        const start = new Date(startStr).toLocaleTimeString([], options);
        
        if (!endStr) return start;
        const end = new Date(endStr).toLocaleTimeString([], options);
        return `${start} - ${end}`;
    }

    function cleanLocation(building, room) {
        let loc = "";
        if (building) loc += building;
        if (room && room !== building) loc += (loc ? " - " : "") + room.split('|')[0].trim(); 
        return loc || "Millersville Campus";
    }

function extractPrice(description) {
        if (!description) return "Free";
        
        // Hunts for a '$' followed by numbers (e.g., $5, $15.50)
        const match = description.match(/\$[0-9]+(\.[0-9]{2})?/);
        
        // If it finds a price, return it. If not, assume it's free!
        return match ? match[0] : "Free";
    }

    // --- INTERACTION LOGIC ---
    function toggleMode() {
        const isTownie = document.getElementById('roleToggle').checked;
        document.body.classList.toggle('townie-mode', isTownie);
        document.getElementById('sub-header').innerText = isTownie ? "Townie View: Local Events" : "Student View: Campus Events";
        
        // Hide the Student button from Townies
        const studentBtn = document.getElementById('btn-student');
        if (studentBtn) {
            studentBtn.style.display = isTownie ? 'none' : 'inline-block';
        }

        // Reset filter if Townie hides the active Student tab
        if (isTownie && currentFilter === 'Student') {
            setFilter('All');
        } else {
            currentPage = 1;
            renderUI();
        }
    }

    function setFilter(keyword) {
        currentFilter = keyword;
        currentPage = 1;
        
        // Remove active class from all buttons, add to the selected one
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.querySelector(`.filter-btn[data-cat="${keyword}"]`);
        if (activeBtn) activeBtn.classList.add('active');
        
        renderUI();
    }

    function filterByDate() {
        currentDateFilter = document.getElementById('datePicker').value; 
        currentPage = 1;
        renderUI();
    }

    function clearDateFilter() {
        currentDateFilter = '';
        document.getElementById('datePicker').value = '';
        currentPage = 1;
        renderUI();
    }

    // --- RENDER LOGIC ---
    function renderUI() {
        const isTownie = document.getElementById('roleToggle').checked;
        const container = document.getElementById('events-container');

        // Apply all filters (Townie, Date, and Category)
        const filtered = currentEvents.filter(e => {
            const catLower = e.category.toLowerCase();
            
            if (currentDateFilter !== '' && e.rawDate !== currentDateFilter) return false;
            if (isTownie && catLower.includes("student")) return false;
            if (currentFilter !== 'All' && !catLower.includes(currentFilter.toLowerCase())) return false;
            
            return true;
        });

        // Slice for pagination
        const start = (currentPage - 1) * itemsPerPage;
        const paginated = filtered.slice(start, start + itemsPerPage);

        // Empty state handling
        if (paginated.length === 0) {
            container.innerHTML = `<p style="text-align:center; width:100%; color:var(--text-muted); padding: 2rem;">No events found for this selection.</p>`;
            document.getElementById('pagination').innerHTML = '';
            return;
        }

// Draw the Event Cards
        container.innerHTML = paginated.map(e => `
            <div class="card">
                <div class="card-header">
                    <span class="price-tag">${e.category}</span>
                </div>
                <h3>${e.name}</h3>
                <div class="card-details">
                    <p>📅 ${e.date}</p>
                    <p>🕒 ${e.time}</p>
                    <p>📍 ${e.loc}</p>
                    <div><span class="cost-badge">${e.price}</span></div>
                </div>
            </div>
        `).join('');

        renderPagination(filtered.length);
    }

    function renderPagination(total) {
        const pages = Math.ceil(total / itemsPerPage);
        const nav = document.getElementById('pagination');
        nav.innerHTML = '';
        if (pages <= 1) return; 

        for (let i = 1; i <= pages; i++) {
            const activeClass = i === currentPage ? 'active' : '';
            nav.innerHTML += `<button class="page-btn ${activeClass}" onclick="goToPage(${i})">${i}</button>`;
        }
    }

    function goToPage(p) { 
        currentPage = p; 
        renderUI(); 
        window.scrollTo({ top: 0, behavior: 'smooth' }); 
    }
</script>
</body>
</html>
