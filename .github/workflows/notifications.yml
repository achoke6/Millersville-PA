name: Daily Push Notifications

# Goal: send push notifications once per day at roughly 7am Eastern, year-round.
#
# Two challenges:
#   1. GitHub Actions cron is unreliable. Crons scheduled at :00 minutes during
#      peak hours (top of every hour, weekday mornings) routinely run 30-60+
#      minutes late OR get skipped entirely. We've already lost one morning's
#      notifications to this — May 7 2026, the 11:00 UTC cron didn't fire and
#      the 12:00 UTC backup hit the DST guard reading "08" and bailed.
#   2. Daylight Saving Time means 7am ET shifts between 11:00 UTC (EDT) and
#      12:00 UTC (EST) twice a year, so we can't just hard-code one cron.
#
# Strategy:
#   - Schedule on the half-hour (9:30 + 10:30 + 11:30 UTC) which is dramatically
#     more reliable than top-of-hour on GitHub's free runners. Three firings,
#     the earliest at 5:30am EDT, so even when GitHub delays a cron 2-3 hours
#     (which we've observed — May 25 2026 both crons fired 9:45+ and 10:20,
#     past the old 6-8am gate, dropping the day) a run still lands in window.
#   - Widen the DST guard to accept any ET hour in 06-10 (handles ~3hrs of
#     cron delay without dropping a day).
#   - Add idempotency check via notifications-status.json on DreamHost: if
#     we already ran today (in ET date), skip. This prevents multiple crons
#     from firing on the same day.
#
# Net result: as long as ONE of the three cron firings lands within a 6am-10am
# ET window on any given day, users get exactly one notification.
on:
  schedule:
    - cron: '30 9 * * *'   # 9:30 UTC  = 5:30am EDT / 4:30am EST
    - cron: '30 10 * * *'  # 10:30 UTC = 6:30am EDT / 5:30am EST
    - cron: '30 11 * * *'  # 11:30 UTC = 7:30am EDT / 6:30am EST
  workflow_dispatch:       # manual trigger for testing

env:
  # The DreamHost-hosted status file the cron writes after each successful run.
  # Used here for idempotency — if today's already done, don't run twice.
  NOTIFICATIONS_STATUS_URL: https://millersville.app/notifications-status.json

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check ET hour and idempotency
        id: dst_check
        run: |
          # Manual workflow_dispatch always proceeds (testing is testing).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Wide ET-hour gate: 6am-10am inclusive. GitHub's cron can be 2-3 hrs
          # late on the free tier (observed May 25 2026). With crons set at :30
          # starting 5:30am ET and a 5-hour acceptance window we tolerate big
          # delays without dropping the day.
          ET_HOUR=$(TZ=America/New_York date +%H)
          ET_DATE=$(TZ=America/New_York date +%Y-%m-%d)
          echo "Local ET: $ET_DATE $ET_HOUR:00"
          case "$ET_HOUR" in
            06|07|08|09|10) echo "  ✓ within 6am-10am ET window" ;;
            *) echo "  ✗ outside 6am-10am ET window — skipping" ; echo "proceed=false" >> "$GITHUB_OUTPUT" ; exit 0 ;;
          esac

          # Idempotency: did we already run today (ET)? Fetch the status file
          # the previous successful run wrote and compare its lastRunAt's ET
          # date to today's ET date. The check is best-effort — any failure
          # (404, malformed JSON, network error) falls back to "proceed" so
          # we don't drop a day's notifications because the idempotency
          # guard itself broke.
          #
          # Why this matters: DreamHost serves an HTML 404 page with a 200
          # OK status when files are missing in some configurations, which
          # defeats `curl -sf` and feeds HTML to jq. We saw that fail once
          # (May 8 2026) — jq exited with code 5, set -e killed the step,
          # the workflow's `if: proceed == 'true'` saw an unset output and
          # silently skipped. Pushes never sent.
          STATUS=$(curl -sf -m 10 "$NOTIFICATIONS_STATUS_URL" || true)
          # Verify it's actually JSON before parsing. `jq -e empty` exits 0
          # only on valid JSON; redirect both stdout and stderr so a parse
          # failure doesn't bleed into the log.
          if [ -n "$STATUS" ] && echo "$STATUS" | jq -e empty >/dev/null 2>&1; then
            LAST_RUN_AT=$(echo "$STATUS" | jq -r '.lastRunAt // empty')
            if [ -n "$LAST_RUN_AT" ]; then
              # Convert lastRunAt to ET date. `date -d` reads the ISO string,
              # TZ env var picks the output zone.
              LAST_RUN_ET_DATE=$(TZ=America/New_York date -d "$LAST_RUN_AT" +%Y-%m-%d 2>/dev/null || echo "")
              echo "Last successful run (ET): $LAST_RUN_ET_DATE"
              if [ "$LAST_RUN_ET_DATE" = "$ET_DATE" ]; then
                echo "  ✗ already ran today — skipping (idempotent)"
                echo "proceed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          else
            # Either no response, or response wasn't JSON. Treat as "no prior
            # run" and proceed — the cost of an extra send (and a 410/404
            # prune cleanup) is much lower than the cost of a dropped day.
            echo "  (no usable prior status — proceeding as first run today)"
          fi

          echo "  ✓ proceeding with push notifications"
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.dst_check.outputs.proceed == 'true'

      - uses: actions/setup-node@v5
        if: steps.dst_check.outputs.proceed == 'true'
        with:
          # Match scraper workflow — Node 22 LTS, Node 20 EOL April 2026.
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.dst_check.outputs.proceed == 'true'
        run: npm ci

      - name: Install lftp (for subscription FTP)
        if: steps.dst_check.outputs.proceed == 'true'
        run: sudo apt-get install -y lftp

      - name: Send daily push notifications
        if: steps.dst_check.outputs.proceed == 'true'
        run: node scripts/send-notifications.js
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          DREAMHOST_USERNAME: ${{ secrets.DREAMHOST_USERNAME }}
          DREAMHOST_PASSWORD: ${{ secrets.DREAMHOST_PASSWORD }}
          DREAMHOST_SERVER: ${{ secrets.DREAMHOST_SERVER }}
          DREAMHOST_DIR: ${{ secrets.DREAMHOST_DIR }}
