name: Weekly Auto-Events Scrape

# Why weekly + Sunday + 3am ET:
#   - Weekly: Tech camps and alumni events change on the order of days/weeks,
#     not hours. Hourly is overkill; monthly is too slow to catch newly-added
#     events. Weekly = max 7-day staleness, runs cheap on free-tier minutes.
#   - Sunday: minimum chance of upstream sources making changes during the
#     run. Any breakage caused by the scrape has Mon-Fri to be detected.
#   - 3am ET: well off-peak. GitHub Actions cron is unreliable at the top of
#     peak hours (top of weekday business hours UTC). 3am ET = 7am UTC summer
#     and 8am UTC winter, neither at peak.
#
# Single cron at 7am UTC works year-round because the exact minute of the
# scrape doesn't matter. In summer (EDT) it runs at 3am ET; in winter (EST)
# it runs at 2am ET. Both fine. No DST guard needed.
on:
  schedule:
    - cron: '0 7 * * 0'  # Sunday 7am UTC (= 3am EDT / 2am EST)
  workflow_dispatch:     # manual trigger for testing

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install lftp (for FTP upload)
        run: sudo apt-get install -y lftp

      - name: Run weekly scraper
        run: node scripts/scrape-monthly.js
        env:
          DREAMHOST_USERNAME: ${{ secrets.DREAMHOST_USERNAME }}
          DREAMHOST_PASSWORD: ${{ secrets.DREAMHOST_PASSWORD }}
          DREAMHOST_SERVER: ${{ secrets.DREAMHOST_SERVER }}
          DREAMHOST_DIR: ${{ secrets.DREAMHOST_DIR }}
