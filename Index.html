<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millersville, PA</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* UI HIGHLIGHTING FIX: Ensures the active tab always shows the green bar */
        .nav-link.active {
            color: var(--text-dark) !important;
            border-bottom: 3px solid var(--accent-fresh) !important;
        }
        /* Live Badge Position Fix */
        .live-overlay {
            position: absolute;
            top: 12px;
            right: 12px; /* MOVED TO TOP RIGHT */
            background: rgba(239, 68, 68, 0.9);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }
    </style>
</head>
<body onload="initApp()">

<header>
    <div class="header-container">
        <div class="logo-block">
            <h1>Millersville, PA</h1>
            <p id="sub-header">MU Student View: Campus App</p>
            <p class="disclaimer">Data Source: Millersville Weather Information Center</p>
        </div>
        
        <nav class="main-nav">
            <button id="nav-home" class="nav-link active" onclick="switchView('home')">Home</button>
            <button id="nav-news" class="nav-link" onclick="switchView('news')">News</button>
            <button id="nav-events" class="nav-link" onclick="switchView('events')">Events</button>
            <button id="nav-food" class="nav-link" onclick="switchView('food')">Dining</button>
            <button id="nav-housing" class="nav-link" onclick="switchView('housing')">Housing</button>
            <button id="nav-services" class="nav-link" onclick="switchView('services')">Services</button>
            <button id="nav-weather" class="nav-link" onclick="switchView('weather')">Weather</button>
            <a href="https://millersville.store" target="_blank" class="nav-link" style="text-decoration: none;">Store ↗</a>
        </nav>

        <div class="header-toggle">
            <span class="mode-label">MU STUDENT</span>
            <label class="toggle-container">
                <input type="checkbox" id="roleToggle" onchange="toggleMode()">
                <span class="toggle-slider"></span>
            </label>
            <span class="mode-label">TOWNIE</span>
        </div>
    </div>
</header>

<main class="container">
    
    <section id="view-home" class="app-view active">
        <div id="home-weather" style="background: var(--theme-color); color: white; padding: 20px; border-radius: var(--radius-lg); margin-bottom: 24px;">
            Loading Millersville Conditions...
        </div>

        <div class="app-card featured" style="margin-bottom: 24px; text-align: center;">
            <p style="font-size: 0.7rem; font-weight: bold; text-transform: uppercase; color: var(--gold);">Official Partner</p>
            <h3 style="margin: 8px 0;">The University Store</h3>
            <a href="https://millersville.store" target="_blank" style="background: var(--gold); color: black; padding: 8px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; display: inline-block;">Shop MU Gear ➔</a>
        </div>

        <div class="section-title"><h2>Today's Events</h2></div>
        <div id="home-events" class="events-grid"></div>
    </section>

    <section id="view-weather" class="app-view">
        <div id="weather-full-container" class="app-card" style="margin-bottom: 20px;">
            <h2 id="weather-temp" style="font-size: 3rem;">--°F</h2>
            <p id="weather-cond" style="font-size: 1.2rem; font-weight: bold;">Loading...</p>
            <p id="weather-detail" style="font-size: 0.9rem; color: var(--text-muted);"></p>
        </div>

        <div class="app-card" style="padding: 0; overflow: hidden; position: relative;">
            <div class="live-overlay">
                <span style="width: 8px; height: 8px; background: white; border-radius: 50%;"></span> LIVE
            </div>
            <img id="weather-cam-img" src="https://snowball.millersville.edu/~cws/wxcam/latest.jpeg" style="width: 100%; display: block;">
            <div style="padding: 10px; background: #eee; font-size: 0.75rem; text-align: right; color: #666;" id="cam-timestamp">
                Updating...
            </div>
        </div>
    </section>

    <section id="view-news" class="app-view"><div id="news-container" class="events-grid"></div></section>
    <section id="view-food" class="app-view"><div id="food-container" class="events-grid"></div></section>
    <section id="view-housing" class="app-view"><div id="housing-container" class="events-grid"></div></section>
    <section id="view-services" class="app-view"><div id="services-container" class="events-grid"></div></section>
</main>

<script>
    // --- NAVIGATION HIGHLIGHT FIX ---
    function switchView(view) {
        document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
        document.getElementById(`view-${view}`).classList.add('active');
        
        document.querySelectorAll('.nav-link').forEach(link => {
            link.classList.remove('active');
            // Check if the link id or text matches the view name
            if(link.id === `nav-${view}`) link.classList.add('active');
        });
        window.scrollTo(0,0);
    }

    async function loadWeather() {
        try {
            const res = await fetch('weather.json');
            const data = await res.json();
            document.getElementById('home-weather').innerHTML = `<h3>${data.temp}°F</h3><p>${data.condition}</p>`;
            document.getElementById('weather-temp').innerText = `${data.temp}°F`;
            document.getElementById('weather-cond').innerText = data.condition;
            document.getElementById('weather-detail').innerText = `Wind: ${data.wind} | Humidity: ${data.humidity}`;
        } catch (e) { console.error("Weather data missing."); }
    }

    function startCamRefresh() {
        setInterval(() => {
            const img = document.getElementById('weather-cam-img');
            img.src = `https://snowball.millersville.edu/~cws/wxcam/latest.jpeg?t=${Date.now()}`;
            document.getElementById('cam-timestamp').innerText = `Last Refreshed: ${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
        }, 60000); // 1 minute refresh
    }

    async function initApp() {
        // CALL ALL DATA LOADERS
        await Promise.allSettled([loadWeather(), loadEvents(), loadDining(), loadHousing(), loadServices(), loadNews()]);
        renderHomeUI();
        startCamRefresh();
    }

    // (Include the rest of your Render/Load functions from previous steps)
</script>
</body>
</html>
