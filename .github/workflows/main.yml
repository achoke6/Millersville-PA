name: Millersville Data Update & Deploy
on:
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node scripts/scrape.js
        env:
          GOOGLE_VISION_API_KEY: ${{ secrets.GOOGLE_VISION_API_KEY }}
          VFW_SHEET_ID: ${{ secrets.VFW_SHEET_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json vfw-cache.json 2>/dev/null || true
          git diff --staged --quiet && echo "No changes to commit" || {
            git commit -m "System: Auto-syncing Community Data"
            git pull --rebase origin main --strategy-option theirs || {
              echo "Rebase conflict — resolving with ours (freshly scraped data wins)"
              git rebase --abort 2>/dev/null || true
              git pull origin main --no-rebase --strategy-option theirs
              git add *.json vfw-cache.json 2>/dev/null || true
              git commit -m "System: Auto-syncing Community Data (merge)" --allow-empty
            }
            git push origin main
          }

      # Minify app.js for production. Runs AFTER the git commit step on
      # purpose — the source-of-truth in the repo stays unminified for
      # diffability and local edits, but the file SFTP'd to DreamHost is
      # the minified version. We overwrite the working-copy app.js in place
      # so the deploy step picks it up automatically.
      #
      # Mangle is safe here: every HTML onclick handler references functions
      # via `window.X` (string property lookup, never mangled). Top-level
      # `function X()` declarations are only called internally so terser's
      # default mangling won't break anything. If you ever add an HTML
      # onclick that references a top-level function name directly, switch
      # to `--keep-fnames` here to be safe.
      #
      # Also sed-replaces the __BUILD_VERSION__ placeholder in sw.js with
      # this run's id so each deploy produces a byte-different service worker.
      # The browser detects the change and triggers an update — no manual
      # cache-version bumps. Sed on JS is fine; the rule "never sed HTML"
      # (which truncated index.html in the past) doesn't apply to JS files
      # without nested-bracket structure issues.
      - name: Minify app.js and stamp SW version
        run: |
          npm install --no-save terser
          npx terser app.js -o app.min.js -c -m
          mv app.min.js app.js
          echo "Minified app.js: $(wc -c < app.js) bytes"
          sed -i "s|__BUILD_VERSION__|${{ github.run_id }}|" sw.js
          echo "Stamped sw.js with build version ${{ github.run_id }}"

      - name: Deploy to DreamHost via SFTP
        run: |
          sudo apt-get install -y lftp
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt..."
            lftp -c "
              set sftp:auto-confirm yes;
              set net:max-retries 3;
              set net:timeout 30;
              set net:reconnect-interval-base 10;
              open -u ${{ secrets.DREAMHOST_USERNAME }},${{ secrets.DREAMHOST_PASSWORD }} sftp://${{ secrets.DREAMHOST_SERVER }};
              mirror --reverse --delete --verbose \
                --exclude ^\.git/ \
                --exclude ^\.github/ \
                --exclude ^node_modules/ \
                --exclude ^scripts/ \
                --exclude ^package\.json$ \
                --exclude ^package-lock\.json$ \
                --exclude ^index_old\.html$ \
                --exclude ^style_old\.css$ \
                --exclude ^404\.html$ \
                --exclude ^vfw-cache\.json$ \
                --exclude ^grocery-cache\.json$ \
                ./ ${{ secrets.DREAMHOST_DIR }};
              put -O ${{ secrets.DREAMHOST_DIR }} .htaccess;
              quit;
            " && echo "Deploy succeeded!" && break || {
              echo "Attempt $attempt failed, waiting 30s..."
              sleep 30
            }
          done

      # Fast-fail alert. The scraper already pings HEALTHCHECK_URL on success
      # (see scrape.js). If the whole job crashes before that ping, healthchecks.io
      # will eventually fire its dead-man alert after the grace period — but this
      # step sends an explicit /fail ping immediately so we hear about it in
      # seconds rather than waiting 30+ minutes. `if: failure()` means it only
      # runs when a prior step failed; `|| true` guarantees the ping itself
      # never flips a successful job red.
      - name: Ping healthchecks.io on failure
        if: failure()
        run: |
          if [ -n "${{ secrets.HEALTHCHECK_URL }}" ]; then
            curl -fsS -m 10 --retry 3 "${{ secrets.HEALTHCHECK_URL }}/fail" || true
          fi
