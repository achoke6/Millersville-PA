name: Millersville API Fetcher

on:
  schedule:
    - cron: '0 0 * * *' # Still runs every night at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No more heavy browsers! Just run the script.
      - name: Fetch API Data
        run: node scripts/scrape.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Auto-update events from API" || echo "No changes to commit"
          git push origin main